{{- /* Custom minimal header - rdegges style */}}
<header class="header">
    <nav class="nav">
        <div class="logo">
            <a href="{{ "/" | absLangURL }}" accesskey="h" title="{{ .Site.Title }} (Alt + H)">{{ .Site.Title }}</a>
        </div>
        <div class="menu-links">
            {{- range .Site.Menus.main }}
            <a href="{{ .URL | absLangURL }}" title="{{ .Name }}">{{ .Name }}</a>
            {{- end }}
        </div>
    </nav>
</header>

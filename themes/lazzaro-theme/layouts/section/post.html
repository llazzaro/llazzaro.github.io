{{ define "main" }}
<article class="content">
  <h1>Posts</h1>
  
  <ul class="post-list">
    {{ range .Pages.ByDate.Reverse }}
    <li>
      <span class="post-date">{{ .Date.Format "02 Jan 2006" }}</span>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ if .Description }}
      <p class="post-summary">{{ .Description }}</p>
      {{ end }}
    </li>
    {{ end }}
  </ul>
</article>
{{ end }}

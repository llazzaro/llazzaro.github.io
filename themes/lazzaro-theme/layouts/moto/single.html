{{ define "main" }}
<article class="content post moto-post">
  <header class="post-header">
    <h1>🏍️ {{ .Title }}</h1>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
    {{ with .Params.distance }}
    <span class="trip-distance">📍 {{ . }}</span>
    {{ end }}
  </header>
  
  <div class="post-content">
    {{ .Content }}
  </div>
  
  <nav class="post-nav">
    {{ with .PrevInSection }}
    <a href="{{ .RelPermalink }}" class="prev">← {{ .Title }}</a>
    {{ end }}
    {{ with .NextInSection }}
    <a href="{{ .RelPermalink }}" class="next">{{ .Title }} →</a>
    {{ end }}
  </nav>
</article>
{{ end }}

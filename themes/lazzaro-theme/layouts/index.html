{{ define "main" }}
<article class="content homepage">
  <div class="intro">
    {{ .Content }}
  </div>
  
  {{ $posts := where .Site.RegularPages "Section" "post" }}
  {{ if $posts }}
  <section class="latest-posts">
    <h2>Latest Posts</h2>
    <ul class="post-list">
      {{ range first 5 $posts }}
      <li>
        <span class="post-date">{{ .Date.Format "02 Jan 2006" }}</span>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
      {{ end }}
    </ul>
    <p><a href="/post/">View all posts →</a></p>
  </section>
  {{ end }}
</article>
{{ end }}

baseURL = "https://www.lazzaro.com.ar"
title = "Leonardo Lazzaro"
theme = "lazzaro-theme"

# Multilingual
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[build]
  environment = "production"

[pagination]
  pagerSize = 100

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  images = ["/images/django-book-cover.jpg"]
  
  dateformat = "02 Jan 2006"
  dateFormat = "02 Jan 2006"
  defaultTheme = "auto"
  disableThemeToggle = false
  disableSpecial1stPost = true
  disableScrollToTop = true
  hideMeta = false
  hideSummary = true
  showtoc = false
  showBreadCrumbs = false
  ShowReadingTime = false
  ShowWordCount = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = false
  ShowAllPagesInArchive = true
  comments = false
  hideFooter = false
  
  [params.schema]
    publisherType = "Person"
    sameAs = [
      "https://github.com/llazzaro",
      "https://linkedin.com/in/llazzaro"
    ]
  
  [params.author]
    name = "Leonardo Lazzaro"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/llazzaro"
    
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/llazzaro"

[taxonomies]
  tag = "tags"

# =============================================================================
# LANGUAGES
# =============================================================================

[languages]
  [languages.en]
    languageName = "EN"
    languageCode = "en"
    weight = 1
    [languages.en.params]
      description = "Software engineer writing about Python, Django, and building things on the web."
      [languages.en.params.homeInfoParams]
        Title = "Leonardo Lazzaro"
        Content = "Software engineer writing about Python, Django, and building things on the web. Author of [Building Web Applications with Django](https://amzn.to/3HkKKfB)."

  [[languages.en.menu.main]]
    name = "Posts"
    url = "/post/"
    weight = 1

  [[languages.en.menu.main]]
    name = "Moto"
    url = "/moto/"
    weight = 2

  [[languages.en.menu.main]]
    name = "About"
    url = "/about/"
    weight = 3

  [languages.es]
    languageName = "ES"
    languageCode = "es"
    weight = 2
    [languages.es.params]
      description = "Ingeniero de software escribiendo sobre Python, Django y desarrollo web."
      [languages.es.params.homeInfoParams]
        Title = "Leonardo Lazzaro"
        Content = "Ingeniero de software escribiendo sobre Python, Django y desarrollo web. Autor de [Building Web Applications with Django](https://amzn.to/3HkKKfB)."

  [[languages.es.menu.main]]
    name = "Artículos"
    url = "/es/post/"
    weight = 1

  [[languages.es.menu.main]]
    name = "Moto"
    url = "/es/moto/"
    weight = 2

  [[languages.es.menu.main]]
    name = "Sobre mí"
    url = "/es/about/"
    weight = 3

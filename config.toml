baseURL = "https://www.lazzaro.com.ar"
languageCode = "en"
defaultContentLanguage = "en"
title = "Leonardo Lazzaro"
theme = "PaperMod"

# Enable production mode for proper indexing
[build]
  environment = "production"

# Pagination
[pagination]
  pagerSize = 10

# Parameters
[params]
  # Social accounts (used for Twitter Cards)
  [params.social]
    twitter = "llazzaro"
  # SEO: Enable production environment for robots indexing
  env = "production"
  
  # SEO: Meta description for homepage and fallback
  description = "Leonardo Lazzaro - Software engineer, Django expert, and author of 'Ultimate Django for Web App Development Using Python'. Learn Django, Python web development, and modern backend practices."
  
  # SEO: Default image for Open Graph and Twitter Cards
  images = ["/images/django-book-cover.jpg"]
  
  # SEO: Site-wide keywords
  keywords = ["Django", "Python", "web development", "software engineering", "Django tutorial", "Python web framework", "backend development", "Leonardo Lazzaro", "Django book"]
  
  dateformat = "2006-01-02"
  dateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  displayFullLangName = false
  disableSpecial1stPost = false
  disableScrollToTop = false
  hideMeta = false
  hideSummary = false
  showtoc = false
  tocopen = false
  showBreadCrumbs = false
  share = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = false
  ShowPageNums = true
  ShowToc = true
  TocFuzzy = true
  TocLevels = 3
  UseHugoToc = true
  comments = false
  customCSS = []
  enableFullRSS = true
  enableHanEmph = true
  enableMathjax = true
  favicon = "/favicon.ico"
  darkmode = false
  hideFooter = true
  
  # SEO: Schema.org structured data settings
  [params.schema]
    publisherType = "Person"
    sameAs = [
      "https://github.com/llazzaro",
      "https://linkedin.com/in/llazzaro",
      "https://x.com/llazzaro"
    ]
  
  [params.author]
    name = "Leonardo Lazzaro"
    bio = "Software engineer and Django expert based in Japan"
    
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/llazzaro"
    
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/llazzaro"
    
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/llazzaro"

  # Hero section featuring the book
  [params.profileMode]
    enabled = true
    title = "📚 Ultimate Django for Web App Development"
    subtitle = "Master Django 4.2 with hands-on projects! Build production-ready web apps using Python, Django Ninja APIs, pytest, Docker & Kubernetes. Perfect for beginners — no prior Python experience required."
    imageUrl = "/images/django-book-cover.jpg"
    imageTitle = "Ultimate Django for Web App Development Using Python - Book Cover"
    imageWidth = 280
    imageHeight = 400

    [[params.profileMode.buttons]]
      name = "📖 Get the Book on Amazon"
      url = "https://amzn.to/3HkKKfB"
      
    [[params.profileMode.buttons]]
      name = "👨‍💻 About the Author"
      url = "/about/"
      
    [[params.profileMode.buttons]]
      name = "📬 Subscribe to Newsletter"
      url = "/newsletter/"

  # Privacy-Friendly Analytics
  # Choose ONE: Plausible (paid but excellent) or GoatCounter (free tier available)
  
  # Plausible Analytics - https://plausible.io
  # Sign up at plausible.io, add your domain, then uncomment:
  # [params.analytics.plausible]
  #   domain = "lazzaro.com.ar"
  #   src = "https://plausible.io/js/script.js"  # or self-hosted URL
  
  # GoatCounter - https://www.goatcounter.com (free for personal sites!)
  # Sign up at goatcounter.com, create a site code, then uncomment:
  # [params.analytics.goatcounter]
  #   code = "lazzaro"  # your-site-code from goatcounter.com

  [params.utterances]
    enable = false
    repo = ""
    issue_term = "pathname"
    label = "Comment"
    theme = "github-light"

# Menu
[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1
    
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 2
    
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 3
    
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 4
    
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 5
    
  [[menu.main]]
    identifier = "newsletter"
    name = "Newsletter"
    url = "/newsletter/"
    weight = 6

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

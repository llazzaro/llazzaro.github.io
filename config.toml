baseURL = "https://www.lazzaro.com.ar"
languageCode = "en"
defaultContentLanguage = "en"
title = "Leonardo Lazzaro"
theme = "PaperMod"

[build]
  environment = "production"

[pagination]
  pagerSize = 100

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  description = "Leonardo Lazzaro - Software engineer writing about Python, Django, and building things on the web."
  images = ["/images/django-book-cover.jpg"]
  
  dateformat = "02 Jan 2006"
  dateFormat = "02 Jan 2006"
  defaultTheme = "auto"
  disableThemeToggle = true
  disableSpecial1stPost = true
  disableScrollToTop = true
  hideMeta = false
  hideSummary = true
  showtoc = false
  showBreadCrumbs = false
  ShowReadingTime = false
  ShowWordCount = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = false
  ShowAllPagesInArchive = true
  comments = false
  hideFooter = false
  
  [params.schema]
    publisherType = "Person"
    sameAs = [
      "https://github.com/llazzaro",
      "https://linkedin.com/in/llazzaro"
    ]
  
  [params.author]
    name = "Leonardo Lazzaro"
    
  # Homepage intro (rdegges style)
  [params.homeInfoParams]
    Title = "Leonardo Lazzaro"
    Content = "Software engineer writing about Python, Django, and building things on the web. Author of [Building Web Applications with Django](https://amzn.to/3HkKKfB)."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/llazzaro"
    
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/llazzaro"
    
  [[params.socialIcons]]
    name = "email"
    url = "mailto:lazzaroleonardo@gmail.com"

# Clean menu (internal pages only, social icons separate)
[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2

[taxonomies]
  tag = "tags"

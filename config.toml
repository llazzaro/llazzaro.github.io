baseURL = "https://www.lazzaro.com.ar"
languageCode = "en"
defaultContentLanguage = "en"
title = "Leonardo Lazzaro"
theme = "PaperMod"

# Pagination
[pagination]
  pagerSize = 10

# Parameters
[params]
  description = "Software engineer, Django expert, and author of 'Ultimate Django for Web App Development Using Python'"
  dateformat = "2006-01-02"
  dateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  displayFullLangName = false
  disableSpecial1stPost = false
  disableScrollToTop = false
  hideMeta = false
  hideSummary = false
  showtoc = false
  tocopen = false
  showBreadCrumbs = false
  share = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = false
  ShowPageNums = true
  ShowToc = true
  TocFuzzy = true
  TocLevels = 3
  UseHugoToc = true
  comments = false
  customCSS = []
  enableFullRSS = true
  enableHanEmph = true
  enableMathjax = true
  favicon = "/favicon.ico"
  keywords = []
  darkmode = false
  hideFooter = true
  
  [params.author]
    name = "Leonardo Lazzaro"
    bio = "Software engineer and Django expert based in Japan"
    
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/llazzaro"
    
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/llazzaro"
    
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/llazzaro"

  # Hero section featuring the book
  [params.profileMode]
    enabled = true
    title = "📚 Ultimate Django for Web App Development"
    subtitle = "Master Django 4.2 with hands-on projects! Build production-ready web apps using Python, Django Ninja APIs, pytest, Docker & Kubernetes. Perfect for beginners — no prior Python experience required."
    imageUrl = "/images/django-book-cover.jpg"
    imageTitle = "Ultimate Django for Web App Development Using Python - Book Cover"
    imageWidth = 280
    imageHeight = 400

    [[params.profileMode.buttons]]
      name = "📖 Get the Book on Amazon"
      url = "https://amzn.to/3HkKKfB"
      
    [[params.profileMode.buttons]]
      name = "👨‍💻 About the Author"
      url = "/about/"
      
    [[params.profileMode.buttons]]
      name = "📬 Subscribe to Newsletter"
      url = "/newsletter/"

  [params.utterances]
    enable = false
    repo = ""
    issue_term = "pathname"
    label = "Comment"
    theme = "github-light"

# Menu
[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1
    
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 2
    
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 3
    
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 4
    
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 5

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

baseURL = "https://www.lazzaro.com.ar"
languageCode = "en"
defaultContentLanguage = "en"
title = "Leonardo Lazzaro"
theme = "PaperMod"

# Enable production mode for proper indexing
[build]
  environment = "production"

# Pagination
[pagination]
  pagerSize = 10

# Markup: allow raw HTML in markdown
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Parameters
[params]
  # Social accounts (used for Twitter Cards)
  [params.social]
    twitter = "llazzaro"
  # SEO: Enable production environment for robots indexing
  env = "production"
  
  # Meta description
  description = "Leonardo Lazzaro - Software engineer writing about Python, Django, and building things on the web."
  
  # Default image for Open Graph
  images = ["/images/django-book-cover.jpg"]
  
  dateformat = "2006-01-02"
  dateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  displayFullLangName = false
  disableSpecial1stPost = false
  disableScrollToTop = false
  hideMeta = false
  hideSummary = false
  showtoc = false
  tocopen = false
  showBreadCrumbs = false
  share = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = false
  ShowPageNums = true
  ShowToc = true
  TocFuzzy = true
  TocLevels = 3
  UseHugoToc = true
  comments = false
  customCSS = []
  enableFullRSS = true
  enableHanEmph = true
  enableMathjax = true
  favicon = "/favicon.ico"
  darkmode = false
  hideFooter = true
  
  # SEO: Schema.org structured data settings
  [params.schema]
    publisherType = "Person"
    sameAs = [
      "https://github.com/llazzaro",
      "https://linkedin.com/in/llazzaro",
      "https://x.com/llazzaro"
    ]
  
  [params.author]
    name = "Leonardo Lazzaro"
    bio = "Software engineer writing about Python, Django, and building things on the web"
    
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/llazzaro"
    
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/llazzaro"
    
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/llazzaro"

  # Hero section - personal intro (inspired by rdegges.com)
  [params.profileMode]
    enabled = true
    title = "Leonardo Lazzaro"
    subtitle = "Hey! I'm a software engineer from Argentina, now living in the Netherlands. I write about Python, Django, and building things on the web. I also wrote a [book on Django](https://amzn.to/3HkKKfB) — check it out if you're learning."
    # Add your avatar: save as static/images/avatar.jpg
    # imageUrl = "/images/avatar.jpg"
    # imageTitle = "Leonardo Lazzaro"
    # imageWidth = 150
    # imageHeight = 150

    [[params.profileMode.buttons]]
      name = "📝 Posts"
      url = "/posts/"
      
    [[params.profileMode.buttons]]
      name = "👤 About"
      url = "/about/"

  # Privacy-Friendly Analytics
  # Choose ONE: Plausible (paid but excellent) or GoatCounter (free tier available)
  
  # Plausible Analytics - https://plausible.io
  # Sign up at plausible.io, add your domain, then uncomment:
  # [params.analytics.plausible]
  #   domain = "lazzaro.com.ar"
  #   src = "https://plausible.io/js/script.js"  # or self-hosted URL
  
  # GoatCounter - https://www.goatcounter.com (free for personal sites!)
  # Sign up at goatcounter.com, create a site code, then uncomment:
  # [params.analytics.goatcounter]
  #   code = "lazzaro"  # your-site-code from goatcounter.com

  [params.utterances]
    enable = false
    repo = ""
    issue_term = "pathname"
    label = "Comment"
    theme = "github-light"

# Menu
[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1
    
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 2
    
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 3
    
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 4
    
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 5

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"
